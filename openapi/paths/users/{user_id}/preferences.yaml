get:
  tags:
    - Preferences
  summary: "Get preferences"
  description: Get a user's preferences.
  operationId: getPreferences

  parameters:
    - $ref: ../../../components/parameters/user_id.yaml

  responses:
    "200":
      description: Preferences retrieved successfully.
      content:
        application/json:
          schema:
            $ref: ../../../components/schemas/Preferences.yaml
    "401":
      $ref: ../../../components/responses/Unauthorized.yaml
    "403":
      $ref: ../../../components/responses/Forbidden.yaml
    "404":
      $ref: ../../../components/responses/users/UserNotFound.yaml

  security:
    - prosaToken: []

put:
  tags:
    - Preferences
  summary: "Update preferences"
  description: |
    Update a user's preferences.  
    The existing preferences will be completely replaced by the new ones.
  operationId: updatePreferences
  parameters:
    - $ref: ../../../components/parameters/user_id.yaml

  requestBody:
    required: true
    description: Request body for updating a user's preferences.
    content:
      application/json:
        schema:
          $ref: ../../../components/schemas/Preferences.yaml
          required:
          - metadata_providers
          - automatic_metadata

  responses:
    "204":
      description: Preferences updated successfully.
    "400":
      description: Invalid or unsupported preferences, a repeated metadata provider, or a provider that requires an API key was enabled without one.
      content:
        text/plain:
          schema:
            type: string
          examples:
            invalidProvider:
              summary: Unknown provider
              value: "Invalid or unsupported metadata provider selection."
            duplicateProvider:
              summary: Provider repeated
              value: "The same metadata provider must not be selected more than once."
            missingProviderKey:
              summary: Provider needs a key
              value: "This metadata provider requires an API key."
            missingAutomaticMetadata:
              summary: "`automatic_metadata` missing"
              value: "Automatic metadata preference must be present."
            malformedJson:
              summary: Malformed JSON body
              value: "Failed to parse the request body as JSON: EOF while parsing an object at line 1 column 1"
    "401":
      $ref: ../../../components/responses/Unauthorized.yaml
    "403":
      $ref: ../../../components/responses/Forbidden.yaml
    "404":
      $ref: ../../../components/responses/users/UserNotFound.yaml
    "422":
      $ref: ../../../components/responses/UnprocessableEntity.yaml

  security:
    - prosaToken: []

patch:
  tags:
    - Preferences
  summary: "Patch preferences"
  description: |
    Partially update a user's preferences.  
    Only the fields specified in the request body will be updated.
  operationId: patchPreferences
  parameters:
    - $ref: ../../../components/parameters/user_id.yaml

  requestBody:
    required: true
    description: Request body for patching a user's preferences.
    content:
      application/json:
        schema:
          $ref: ../../../components/schemas/Preferences.yaml
          minProperties: 1

  responses:
    "204":
      description: Preferences patched successfully.
    "400":
      description: No fields specified, invalid/unsupported preferences, a repeated metadata provider, or a provider that requires an API key was enabled without one.
      content:
        text/plain:
          schema:
            type: string
          examples:
            invalidPreferences:
              summary: No fields specified
              value: "Invalid or unsupported preferences provided."
            invalidProvider:
              summary: Unknown provider
              value: "Invalid or unsupported metadata provider selection."
            duplicateProvider:
              summary: Provider repeated
              value: "The same metadata provider must not be selected more than once."
            missingProviderKey:
              summary: Provider needs a key
              value: "This metadata provider requires an API key."
            malformedJson:
              summary: Malformed JSON body
              value: "Failed to parse the request body as JSON: EOF while parsing an object at line 1 column 1"
    "401":
      $ref: ../../../components/responses/Unauthorized.yaml
    "403":
      $ref: ../../../components/responses/Forbidden.yaml
    "404":
      $ref: ../../../components/responses/users/UserNotFound.yaml
    "422":
      $ref: ../../../components/responses/UnprocessableEntity.yaml

  security:
    - prosaToken: []
