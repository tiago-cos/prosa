delete:
  tags:
    - Books
  summary: "Remove a book from a shelf"
  description: |
    Remove a specific book from the specified shelf.
  operationId: removeBookFromShelf
  parameters:
    - $ref: ../../../../components/parameters/shelf_id.yaml
    - $ref: ../../../../components/parameters/book_id.yaml

  responses:
    "204":
      description: The book was successfully removed from the shelf.
    "401":
      $ref: ../../../../components/responses/Unauthorized.yaml
    "403":
      $ref: ../../../../components/responses/Forbidden.yaml
    "404":
      description: The shelf was not found, or the book is not in the shelf.
      content:
        text/plain:
          schema:
            type: string
          examples:
            shelfNotFound:
              summary: Shelf not found
              value: "The requested shelf does not exist or is not accessible."
            shelfBookNotFound:
              summary: Book not in shelf
              value: "The provided book does not exist in this shelf, or is not accessible."
   
