post:
  tags:
    - File
  summary: "Upload a book"
  description: |
    Upload a book file to the server.  
    The uploaded file is associated with the specified user.  
  
    **Note:**  
      - If `owner_id` is not provided, the user will be inferred from the authentication token;  
      - The request body may not be bigger than `50 MiBs`;  
      - The uploaded file must have the `EPUB` format.  
  operationId: uploadBook
  requestBody:
    required: true
    description: Request body containing the book file and the owner ID.
    content:
      multipart/form-data:
        schema:
          type: object
          properties:
            owner_id:
              type: string
              format: uuid
              description: |
                _(Optional)_ The UUID of the user who owns the book.
                If not specified, the owner is determined from the authenticated user.
            book_id:
              type: string
              format: uuid
              description: |
                _(Optional)_ The UUID the book should be created under.
                If not specified, one is generated. A value that is not a UUID
                is rejected, as is one already in use.
            epub:
              type: string
              format: binary
              description: |
                The book file to be uploaded. 
                Only files in the `application/epub+zip` format are accepted.
          required:
            - epub

  responses:
    "200":
      description: The book file was uploaded successfully.
      content:
        text/plain:
          schema:
            type: string
            description: The unique ID of the uploaded book file.
          examples:
            success:
              summary: Example response for a successful upload
              value: "2c5f1d4d-3b9d-4b9d-3b9d-4b9d3b9d3b9d"
    "400":
      $ref: ../components/responses/BadRequest.yaml
    "401":
      $ref: ../components/responses/Unauthorized.yaml
    "403":
      $ref: ../components/responses/Forbidden.yaml
    "404":
      $ref: ../components/responses/users/UserNotFound.yaml
    "409":
      $ref: ../components/responses/books/BookConflict.yaml


get:
  tags:
    - Search Books
  summary: "Search for books"
  description: |
    Retrieve a paginated list of books that match the search criteria.
    
    **Note:** Only users with admin privileges can search without user-based filtering.
  operationId: searchBooks
  parameters:
    - $ref: ../components/parameters/username.yaml
    - name: title
      in: query
      required: false
      description: Title search query.
      schema:
        type: string
      example: "The Great Gatsby"
    - name: author
      in: query
      required: false
      description: Author search query.
      schema:
        type: string
      example: "Rick Riordan"
    - $ref: ../components/parameters/page.yaml
    - $ref: ../components/parameters/size.yaml

  responses:
    "200":
      description: The result of the search.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/BookSearchResult.yaml
    "400":
      $ref: ../components/responses/InvalidPagination.yaml
    "401":
      $ref: ../components/responses/Unauthorized.yaml
    "403":
      $ref: ../components/responses/Forbidden.yaml
    "404":
      $ref: ../components/responses/users/UserNotFound.yaml

