post:
  tags:
    - Shelves
  summary: "Create a shelf"
  description: |
    Create a new shelf for organizing books.

    **Note:** If `owner_id` is not provided, the user will be inferred from the authentication token.  
    **Another note:** If the authenticated user is not an admin, they can only create shelves for themselves.
  operationId: createShelf
  requestBody:
    required: true
    description: Request body containing the shelf name and the owner's UUID.
    content:
      application/json:
        schema:
          type: object
          properties:
            name:
              type: string
              description: The name of the shelf.
            owner_id:
              type: string
              format: uuid
              description: |
                _(Optional)_ The UUID of the user who owns the shelf.
                If not specified, the owner is determined from the authenticated user.
            shelf_id:
              type: string
              format: uuid
              description: |
                _(Optional)_ The UUID the shelf should be created under.
                If not specified, one is generated. A value that is not a UUID
                is rejected, as is one already in use.
          required:
            - name
        example:
          name: "Fiction Favorites"
          owner_id: "9b6a18d1-6dc1-43dd-b1a2-6888660e9735"

  responses:
    "200":
      description: The shelf was created successfully.
      content:
        text/plain:
          schema:
            type: string
            description: The unique ID of the created shelf.
          examples:
            success:
              summary: Example response for a successful shelf creation
              value: "050299f0-6d4d-4015-a522-9aeb92924a56"
    "400":
      description: The provided shelf name is invalid, or the provided shelf id is not a valid UUID.
    "401":
      $ref: ../components/responses/Unauthorized.yaml
    "403":
      $ref: ../components/responses/Forbidden.yaml
    "404":
      $ref: ../components/responses/users/UserNotFound.yaml
    "409":
      description: There is already a shelf with this name in your library, or the provided shelf id is already in use.


get:
  tags:
    - Search Shelves
  summary: "Search for shelves"
  description: |
    Retrieve a paginated list of shelves that match the search criteria.

    **Note:** Only users with admin privileges can search without user-based filtering.
  operationId: searchShelves
  parameters:
    - $ref: ../components/parameters/username.yaml
    - name: name
      in: query
      required: false
      description: Shelf name search query.
      schema:
        type: string
      example: "Sci-Fi"
    - $ref: ../components/parameters/page.yaml
    - $ref: ../components/parameters/size.yaml

  responses:
    "200":
      description: The result of the shelf search.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ShelfSearchResult.yaml
    "400":
      $ref: ../components/responses/InvalidPagination.yaml
    "401":
      $ref: ../components/responses/Unauthorized.yaml
    "403":
      $ref: ../components/responses/Forbidden.yaml
    "404":
      $ref: ../components/responses/users/UserNotFound.yaml

