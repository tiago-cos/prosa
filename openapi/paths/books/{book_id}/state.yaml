get:
  tags:
    - State
  summary: "Get book state"
  description: |
    Retrieve state for a specific book owned by a user.
  operationId: getBookState
  parameters:
    - $ref: ../../../components/parameters/book_id.yaml

  responses:
    "200":
      description: The book state was retrieved successfully.
      content:
        application/json:
          schema:
            $ref: ../../../components/schemas/RequiredBookState.yaml
    "401":
      $ref: ../../../components/responses/Unauthorized.yaml
    "403":
      $ref: ../../../components/responses/Forbidden.yaml
    "404":
      $ref: ../../../components/responses/books/BookNotFound.yaml


put:
  tags:
    - State
  summary: "Update book state"
  description: |
    Update state for a specific book owned by a user.  
    The existing state will be completely replaced by the new one.
  operationId: updateBookState
  parameters:
    - $ref: ../../../components/parameters/book_id.yaml

  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../../components/schemas/RequiredBookState.yaml

  responses:
    "204":
      description: The book state was updated successfully.
    "400":
      description: The provided book state is invalid.
      content:
        text/plain:
          schema:
            type: string
          examples:
            invalidState:
              summary: Invalid state
              value: "The provided state is invalid."
            invalidLocation:
              summary: Location not in the book
              value: "The provided location is invalid."
            invalidRating:
              summary: Rating out of range
              value: "The provided rating is invalid."
            invalidReadingStatus:
              summary: Unknown reading status
              value: "The provided reading status is invalid."
            locationWithoutReading:
              summary: Location while not Reading
              value: "A location is only allowed while the reading status is Reading."
            malformedJson:
              summary: Malformed JSON body
              value: "Failed to parse the request body as JSON: EOF while parsing an object at line 1 column 1"
    "401":
      $ref: ../../../components/responses/Unauthorized.yaml
    "403":
      $ref: ../../../components/responses/Forbidden.yaml
    "404":
      $ref: ../../../components/responses/books/BookNotFound.yaml
    "422":
      $ref: ../../../components/responses/UnprocessableEntity.yaml


patch:
  tags:
    - State
  summary: "Patch book state"
  description: |
    Update state for a specific book owned by a user.  
    Only the fields specified in the request body will be updated. Patching the
    reading status to `Unread` or `Read` also removes the location.
  operationId: patchBookState
  parameters:
    - $ref: ../../../components/parameters/book_id.yaml

  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../../components/schemas/BookState.yaml
          minProperties: 1

  responses:
    "204":
      description: The book state was patched successfully.
    "400":
      description: The provided book state is invalid.
      content:
        text/plain:
          schema:
            type: string
          examples:
            invalidState:
              summary: Invalid state
              value: "The provided state is invalid."
            invalidLocation:
              summary: Location not in the book
              value: "The provided location is invalid."
            invalidRating:
              summary: Rating out of range
              value: "The provided rating is invalid."
            invalidReadingStatus:
              summary: Unknown reading status
              value: "The provided reading status is invalid."
            locationWithoutReading:
              summary: Location while not Reading
              value: "A location is only allowed while the reading status is Reading."
            malformedJson:
              summary: Malformed JSON body
              value: "Failed to parse the request body as JSON: EOF while parsing an object at line 1 column 1"
    "401":
      $ref: ../../../components/responses/Unauthorized.yaml
    "403":
      $ref: ../../../components/responses/Forbidden.yaml
    "404":
      $ref: ../../../components/responses/books/BookNotFound.yaml
    "422":
      $ref: ../../../components/responses/UnprocessableEntity.yaml

