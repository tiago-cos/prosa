get:
  tags:
    - Annotations
  summary: "Get book annotation"
  description: |
    Retrieve a specific annotation for a book owned by the user.
  operationId: getBookAnnotation
  parameters:
    - $ref: ../../../../components/parameters/book_id.yaml
    - $ref: ../../../../components/parameters/annotation_id.yaml

  responses:
    "200":
      description: The book annotation was retrieved successfully.
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/Annotation.yaml
    "401":
      $ref: ../../../../components/responses/Unauthorized.yaml
    "403":
      $ref: ../../../../components/responses/Forbidden.yaml
    "404":
      description: The requested book or annotation was not found or cannot be accessed.
      content:
        text/plain:
          schema:
            type: string
          examples:
            bookNotFound:
              summary: Book not found
              value: "The requested book does not exist or is not accessible."
            annotationNotFound:
              summary: Annotation not found
              value: "The requested annotation does not exist or is not accessible."


delete:
  tags:
    - Annotations
  summary: "Delete book annotation"
  description: |
    Delete a specific annotation from a book owned by the user.
  operationId: deleteBookAnnotation
  parameters:
    - $ref: ../../../../components/parameters/book_id.yaml
    - $ref: ../../../../components/parameters/annotation_id.yaml

  responses:
    "204":
      description: The book annotation was deleted successfully.
    "401":
      $ref: ../../../../components/responses/Unauthorized.yaml
    "403":
      $ref: ../../../../components/responses/Forbidden.yaml
    "404":
      description: The requested book or annotation was not found or cannot be accessed.
      content:
        text/plain:
          schema:
            type: string
          examples:
            bookNotFound:
              summary: Book not found
              value: "The requested book does not exist or is not accessible."
            annotationNotFound:
              summary: Annotation not found
              value: "The requested annotation does not exist or is not accessible."



patch:
  tags:
    - Annotations
  summary: "Patch book annotation"
  description: |
    Update the note of a specific annotation for a book owned by the user.  
    Sending `null`, an empty string, or no `note` at all deletes the existing note.
  operationId: patchBookAnnotation
  parameters:
    - $ref: ../../../../components/parameters/book_id.yaml
    - $ref: ../../../../components/parameters/annotation_id.yaml

  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            note:
              type: [string, "null"]
              description: The updated note content. `null` or an empty string removes the existing note.
              example: "This section explains a key concept."
          additionalProperties: false


  responses:
    "204":
      description: The book annotation note was updated successfully.
    "400":
      $ref: ../../../../components/responses/MalformedJson.yaml
    "401":
      $ref: ../../../../components/responses/Unauthorized.yaml
    "403":
      $ref: ../../../../components/responses/Forbidden.yaml
    "404":
      description: The requested book or annotation was not found or cannot be accessed.
      content:
        text/plain:
          schema:
            type: string
          examples:
            bookNotFound:
              summary: Book not found
              value: "The requested book does not exist or is not accessible."
            annotationNotFound:
              summary: Annotation not found
              value: "The requested annotation does not exist or is not accessible."
    "422":
      $ref: ../../../../components/responses/UnprocessableEntity.yaml

  security:
    - prosaToken: []
    - apiKey: []