post:
  tags:
    - Metadata
  summary: "Add book metadata"
  description: |
    Add metadata for a specific book owned by a user.
  operationId: addBookMetadata
  parameters:
    - $ref: ../../../components/parameters/book_id.yaml

  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../../components/schemas/Metadata.yaml
        examples:
          $ref: ../../../components/examples/Metadata.yaml

  responses:
    "204":
      description: The book metadata was added successfully.
    "400":
      $ref: ../../../components/responses/metadata/InvalidMetadata.yaml
    "401":
      $ref: ../../../components/responses/Unauthorized.yaml
    "403":
      $ref: ../../../components/responses/Forbidden.yaml
    "404":
      $ref: ../../../components/responses/books/BookNotFound.yaml
    "409":
      $ref: ../../../components/responses/metadata/MetadataConflict.yaml
    "422":
      $ref: ../../../components/responses/UnprocessableEntity.yaml


get:
  tags:
    - Metadata
  summary: "Get book metadata"
  description: |
    Retrieve metadata for a specific book owned by a user.
  operationId: getBookMetadata
  parameters:
    - $ref: ../../../components/parameters/book_id.yaml

  responses:
    "200":
      description: The book metadata was retrieved successfully.
      content:
        application/json:
          schema:
            $ref: ../../../components/schemas/Metadata.yaml
          examples:
            $ref: ../../../components/examples/Metadata.yaml
    "401":
      $ref: ../../../components/responses/Unauthorized.yaml
    "403":
      $ref: ../../../components/responses/Forbidden.yaml
    "404":
      description: The requested book or metadata was not found or cannot be accessed.
      content:
        text/plain:
          schema:
            type: string
          examples:
            bookNotFound:
              summary: Book not found
              value: "The requested book does not exist or is not accessible."
            metadataNotFound:
              summary: Metadata not found
              value: "The requested metadata does not exist or is not accessible."


put:
  tags:
    - Metadata
  summary: "Update book metadata"
  description: |
    Update metadata for a specific book owned by a user.  
    The existing metadata will be completely replaced by the new one.
  operationId: updateBookMetadata
  parameters:
    - $ref: ../../../components/parameters/book_id.yaml

  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../../components/schemas/Metadata.yaml
        examples:
          $ref: ../../../components/examples/Metadata.yaml

  responses:
    "204":
      description: The book metadata was updated successfully.
    "400":
      $ref: ../../../components/responses/metadata/InvalidMetadata.yaml
    "401":
      $ref: ../../../components/responses/Unauthorized.yaml
    "403":
      $ref: ../../../components/responses/Forbidden.yaml
    "404":
      description: The requested book or metadata was not found or cannot be accessed.
      content:
        text/plain:
          schema:
            type: string
          examples:
            bookNotFound:
              summary: Book not found
              value: "The requested book does not exist or is not accessible."
            metadataNotFound:
              summary: Metadata not found
              value: "The requested metadata does not exist or is not accessible."
    "422":
      $ref: ../../../components/responses/UnprocessableEntity.yaml


delete:
  tags:
    - Metadata
  summary: "Delete book metadata"
  description: |
    Delete metadata for a specific book owned by a user.
  operationId: deleteBookMetadata
  parameters:
    - $ref: ../../../components/parameters/book_id.yaml

  responses:
    "204":
      description: The book metadata was deleted successfully.
    "401":
      $ref: ../../../components/responses/Unauthorized.yaml
    "403":
      $ref: ../../../components/responses/Forbidden.yaml
    "404":
      description: The requested book or metadata was not found or cannot be accessed.
      content:
        text/plain:
          schema:
            type: string
          examples:
            bookNotFound:
              summary: Book not found
              value: "The requested book does not exist or is not accessible."
            metadataNotFound:
              summary: Metadata not found
              value: "The requested metadata does not exist or is not accessible."


patch:
  tags:
    - Metadata
  summary: "Patch book metadata"
  description: |
    Patch metadata for a specific book owned by a user.  
    Only the fields specified in the request body will be updated.
  operationId: patchBookMetadata
  parameters:
    - $ref: ../../../components/parameters/book_id.yaml

  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../../components/schemas/Metadata.yaml
        examples:
          $ref: ../../../components/examples/Metadata.yaml

  responses:
    "204":
      description: The book metadata was updated successfully.
    "400":
      $ref: ../../../components/responses/metadata/InvalidMetadata.yaml
    "401":
      $ref: ../../../components/responses/Unauthorized.yaml
    "403":
      $ref: ../../../components/responses/Forbidden.yaml
    "404":
      description: The requested book or metadata was not found or cannot be accessed.
      content:
        text/plain:
          schema:
            type: string
          examples:
            bookNotFound:
              summary: Book not found
              value: "The requested book does not exist or is not accessible."
            metadataNotFound:
              summary: Metadata not found
              value: "The requested metadata does not exist or is not accessible."
    "422":
      $ref: ../../../components/responses/UnprocessableEntity.yaml

