type: object
description: Contains the current state of a book.
properties:
  location:
    type: string
    description: |
      The location in the book where the reader last left off, as an EPUB
      location: content document, element path from `<body>`, text run and
      character offset. See `AnnotationRequest` for the full format.
    example: "OEBPS/chapter-001.xhtml#0/2/t1:44"
  statistics:
    type: object
    description: The statistics of the book.
    properties:
      rating:
        type: number
        format: float
        description: The rating of the book.
        example: 4.5
      reading_status:
        type: string
        description: The current reading status of the book.
        enum: ["Unread", "Reading", "Read"]
        example: "Unread"

additionalProperties: false
