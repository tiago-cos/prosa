type: object
description: App API key
properties:
  name:
    type: string
    description: The name of the API key.
    example: "My API Key"
  capabilities:
    type: array
    items:
      $ref: ./Capability.yaml
    example: ["Create", "Read"]
    description: |
      An array of capabilities associated with the API key.
      Capabilities determine the actions that the API key can perform.
  expires_at:
    type: number
    description: The expiration date and time of the API key (UNIX milliseconds).
    example: 1712761552000
  key_id:
    type: string
    format: uuid
    writeOnly: true
    description: |
      _(Optional)_ The UUID the key should be created under.
      If not specified, one is generated. A value that is not a UUID is
      rejected, as is one already in use.
    example: "3a8d9e3a-8d9e-3a8d-9e3a-8d9e3a8d9e3a"
required:
  - name
  - capabilities