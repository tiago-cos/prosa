type: object
description: Represents a series of books.
properties:
  title:
    type: string
    description: The title of the series.
    example: "Harry Potter"
  number:
    type: number
    description: _(Optional)_ The number of the book in the series. Absent when the book belongs to a series without a known position in it.
    example: 3
required:
  - title
additionalProperties: false
