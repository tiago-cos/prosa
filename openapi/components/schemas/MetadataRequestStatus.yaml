type: object
description: Represents a metadata fetch request.
properties:
  user_id:
    type: string
    description: The ID of the user who submitted the request.
    example: "johndoe"
  book_id:
    type: string
    description: The ID of the book for which metadata is being fetched.
    example: "1e841a44-feb4-489c-8f1e-cb0e4b1c8ed2"
  providers:
    type: array
    description: The list of metadata providers used for this request.
    items:
      type: string
      enum:
        - epub_metadata_extractor
        - openlibrary
        - hardcover
        - google_books
    example:
      - "epub_metadata_extractor"
      - "openlibrary"
  status:
    type: string
    enum:
      - Waiting
      - InProgress
    description: |
      `Waiting` while the request is queued, `InProgress` once its metadata is
      being fetched. Requests are handled one at a time, so at most one is
      `InProgress`.
    example: "Waiting"

required:
  - user_id
  - book_id
  - providers
  - status

additionalProperties: false