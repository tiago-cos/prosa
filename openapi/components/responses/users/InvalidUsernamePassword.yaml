description: The provided username or password is invalid, the provided user id is not a valid UUID, or the body is not valid JSON.
content:
  text/plain:
    schema:
      type: string
    examples:
      invalidCharacters:
        summary: Disallowed characters
        value: Username and password must not contain special characters.
      usernameTooLong:
        summary: Username too long
        value: Username must not exceed 20 characters.
      passwordTooLong:
        summary: Password too long
        value: Password must not exceed 256 characters.
      invalidUserId:
        summary: User id is not a UUID
        value: The provided user id is invalid.
      malformedJson:
        summary: Malformed JSON body
        value: 'Failed to parse the request body as JSON: EOF while parsing an object at line 1 column 1'
