description: 'The upload is invalid: the file is not a valid EPUB, the book id is not a valid UUID, or the multipart body is malformed or lacks the `epub` field.'
content:
  text/plain:
    schema:
      type: string
    examples:
      invalidEpub:
        summary: Not a valid EPUB
        value: The provided EPUB data is invalid.
      invalidBookId:
        summary: Book id is not a UUID
        value: The provided book id is invalid.
      missingFile:
        summary: No `epub` field
        value: field 'epub' is required
