description: An annotation already exists at this position, or the provided annotation id is already in use.
content:
  text/plain:
    schema:
      type: string
    examples:
      annotationConflict:
        summary: Same position
        value: An annotation in this position already exists.
      annotationIdConflict:
        summary: Annotation id in use
        value: The provided annotation id is already in use.
