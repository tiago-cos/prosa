openapi: 3.1.0
info:
  version: 0.1.0
  title: Prosa
  contact:
    name: Tiago Sousa
    email: tiago.costa.sousa@proton.me
    url: https://github.com/tiago-cos
  license:
    name: MIT
    url: https://opensource.org/license/MIT

  description: |
    # Overview

    Prosa is a self-hosted book server for managing and reading your personal collection.

    ## Main Features

    ### Book Management

    - Manage EPUB files, including metadata and cover images
    - Organize books into shelves

    ### Reading, Annotations & Ratings

    - Track and store reading progress for each book
    - Add and manage book annotations
    - Rate books

    ### Automatic Metadata Fetching

    - Automatically extract book metadata from various providers

    ### User & Device Support

    - Support multiple users with different roles (regular and admin)
    - Sync books, annotations, and reading progress across multiple devices

    ## User Types

    - **Regular Users** – Can perform operations only on their own books
    - **Admin Users** – Have full access to perform any operation on any book in the system

    ## Authentication

    - **JWT tokens** – Obtain from the authentication endpoint
    - **API keys** – Create in your user preferences

    # Configuration

    Prosa can be configured in two ways:

    1. **Configuration files (TOML)**
    2. **Environment variables**

    The configuration system is layered, meaning defaults are loaded first and then overridden by local configuration or environment variables.

    ## Default Configuration

    Prosa comes with built-in default configurations that are embedded directly into the binary.  

    The following example shows the default configuration values.  
    You can override these defaults by providing your own configuration file.

    ### Example (Default) Configuration

    ```toml
    [server]
    host = "0.0.0.0"
    port = 5000

    # Define admin_key in your configuration

    [auth]
    # admin_key = "admin_key"
    jwt_token_duration = 900
    refresh_token_duration = 604800
    allow_user_registration = true
    public_key_path = "library/public_key.bin"
    private_key_path = "library/private_key.bin"
    symmetric_key_path = "library/symmetric_key.bin"

    [book_storage]
    epub_path = "library/epubs"
    cover_path = "library/covers"

    [metadata_cooldown]
    openlibrary = 1000
    hardcover = 1000
    google_books = 1000

    [database]
    file_path = "library/database.db"
    max_connections = 16
    busy_timeout_seconds = 10
    backup_before_migration = true
    ```

    ## Local Configuration

    Any value from the default configuration can be overridden by creating a local configuration file.

    By default, Prosa looks for `src/config/configuration.toml`.

    You can change this path using the `CONFIGURATION` environment variable.  
    Values defined in `configuration.toml` will override the default values.

    ## Environment Variables

    All configuration values can also be controlled directly through environment variables.  
    The format is `<SECTION>__<KEY>`.

    -   Sections map to the `[section]` headers in the TOML file.
        
    -   Keys map to the field names inside each section.

    **Important:**

    - Sections and keys are separated using **double underscores (`__`)**.
        
    - Single underscores (`_`) inside a key name (e.g. `admin_key`) remain as-is and **are not separators**.
        
    For example:

    - To set the server port (`[server].port`):
        
      ```bash
      export SERVER__PORT=8080
      ```

    - To set the admin key (`[auth].admin_key`):  
      _(notice there is only **one underscore** between `ADMIN` and `KEY` because the field name itself has an underscore)_
        
      ```bash
      export AUTH__ADMIN_KEY=super_secret_key
      ```

    ## Configuration Reference

    -   **[server]**
        
        -   `host`: Network interface where the server will listen.
            
        -   `port`: Port number the server will listen on.
            
    -   **[auth]**
        
        -   `admin_key`: Secret used to register admin users. **Must be defined and at least 8 characters long.**  
        The server will not start if this is missing or too short.
            
        -   `jwt_token_duration`: Expiration duration for JWT tokens (seconds).
            
        -   `refresh_token_duration`: Expiration duration for refresh tokens (seconds).

        -   `allow_user_registration`: Whether new users can register without an admin key.  
        Set to `true` to allow anyone to register and `false` to require the admin key for all registrations.

        -   `public_key_path`, `private_key_path`: Paths to the files that will store the JWT signing key pair.

        -   `symmetric_key_path`: Path to the file that will store the symmetric key used to encrypt
        stored metadata provider API keys. Generated on first run; losing it means every stored key
        has to be entered again.
            
    -   **[book_storage]**
        
        -   `epub_path`: Directory where EPUB files are stored.
            
        -   `cover_path`: Directory where cover images are stored.
            
    -   **[metadata_cooldown]**

        Minimum delay (ms) between requests to each online catalogue. The EPUB
        metadata extractor reads the book file itself, so it has no cooldown.

        -   `openlibrary`: Minimum delay (ms) between Open Library requests.

        -   `hardcover`: Minimum delay (ms) between Hardcover requests.

        -   `google_books`: Minimum delay (ms) between Google Books requests.
            
    -   **[database]**
        
        -   `file_path`: Path to the SQLite database file.
            
        -   `max_connections`: Size of the SQLite connection pool.
            
        -   `busy_timeout_seconds`: How long a statement waits for a contended write before failing.
            
        -   `backup_before_migration`: Snapshot the database before applying or reverting schema migrations.
            
    # Database Schema

    The schema is managed with versioned, reversible migrations that are embedded
    into the binary at build time. There is nothing to deploy alongside the
    executable and no manual setup step.

    On startup Prosa applies any migrations the database has not seen yet. A
    database created by an older Prosa is upgraded in place, and a snapshot is
    written next to it first (unless `backup_before_migration` is disabled).

    ## Inspecting the schema

    ```bash
    prosa --migrate-status
    ```

    Lists every migration, whether it has been applied, and whether it can be
    reverted.

    ## Downgrading

    ```bash
    prosa --migrate-down <version>
    ```

    Reverts every migration newer than `<version>`.

    **A binary can only revert migrations whose down scripts it carries.** To move
    from a newer Prosa to an older one, run `--migrate-down` with the *newer*
    binary first, then swap in the older one. Running it the other way round
    leaves the schema ahead of the code. Prosa refuses to start a revert it cannot
    complete rather than leaving the schema half-migrated.

    ## Logging

    You can control the logging level using the standard `RUST_LOG` environment variable.  
    Supported values include `error`, `warn`, `info`, `debug`, and `trace`.

    - Default:
      ```bash
      RUST_LOG=info
      ```
        
    - Example (set log level to warn):
      ```bash
      export RUST_LOG=warn
      ```

    # Installation & Setup

    Prosa can be run either as a **Docker container (recommended)** or as a standalone **binary**.

    ## Docker Container (Recommended)

    The simplest way to get Prosa running is with Docker. Add the following entry to your `docker-compose.yml`:

    ```yaml
    services:
      prosa:
        image: tsousa28/prosa
        container_name: prosa
        ports:
          - "5000:5000"
        environment:
          - AUTH__ADMIN_KEY=very_secret_key
        volumes:
          - prosa_library:/app/library
        restart: unless-stopped

    volumes:
      prosa_library:
    ```

    This will start Prosa and make it available on port `5000`.

    **Important notes:**

    -  Don't forget to set `AUTH__ADMIN_KEY` to a secure value before using Prosa.
        
    -  Persistence requires a **named volume** mounted at `/app/library` inside the container. Bind mounts are currently not supported due to permission issues in the rootless container.
        
    -  Environment variables to change paths are ignored in this container image.
        
    ## Binary

    If you prefer running Prosa as a binary:

    1.  **Configure Prosa**  
        Adjust the configuration file as needed (authentication, storage paths, etc.).
        
    2.  **Run the Server**  
        Launch the binary, and Prosa will be ready to accept connections.

    ## Next Steps

    1.  **Create a User**  
        Register a new user with the [Register User](#tag/Authentication/operation/register) endpoint.
        
    2.  **(Optional) Enable Online Metadata Providers**  
        A new user starts with only `epub_metadata_extractor` enabled, so no
        third-party service is contacted until you ask for one.

        -   To enable others, update your preferences with the [Patch User Preferences](#tag/Preferences/operation/patchPreferences) endpoint.

        -   Add the providers you want to the `metadata_providers` array, in order of preference.
            `openlibrary` needs nothing further; `hardcover` and `google_books` require an API key,
            supplied in the same request through `provider_keys`. Stored keys are encrypted and are
            never returned.

        -   `GET /config` lists the providers this server knows about and which of them need a key.
            
    3.  **Upload Your First Book**  
        Add a book using the [Upload Book](#tag/File/operation/uploadBook) endpoint. You can also manage metadata and cover images at this stage.

    You’re now ready to browse, read, and annotate your books with Prosa!


externalDocs:
  description: "Checkout the project repository for more information."
  url: "https://github.com/tiago-cos/prosa"

tags:
  - name: Server
    description: What this deployment is and what it allows. No credentials needed.
  - name: File
    description: Uploading, downloading and deleting the EPUB itself.
  - name: Cover
    description: The image shown for a book.
  - name: Metadata
    description: What a book is -- title, authors, publisher, series and the rest.
  - name: Annotations
    description: Passages a reader marked, and the notes attached to them.
  - name: State
    description: Where a reader left off, and what they thought of the book.
  - name: Shelves
    description: Creating, renaming and deleting shelves.
  - name: Books
    description: Which books a shelf holds.
  - name: Search Shelves
    description: Finding shelves by owner or name.
  - name: Search Books
    description: Finding books by owner, title or author.
  - name: Sync
    description: What has changed since a client last asked.
  - name: Authentication
    description: Registering, signing in, and the keys that verify a token.
  - name: User Profile
    description: Reading and changing a user's own details.
  - name: Preferences
    description: Which metadata providers a user uses, and in what order.
  - name: API Keys
    description: Long-lived credentials for a device, scoped to chosen capabilities.

x-tagGroups:
  - name: Book Management
    tags:
      - File
      - Cover
      - Metadata
      - Annotations
      - State
      - Search Books
  - name: Shelf Management
    tags:
      - Shelves
      - Books
      - Search Shelves
  - name: Syncing Devices
    tags:
      - Sync
  - name: User Management
    tags:
      - Authentication
      - User Profile
      - Preferences
      - API Keys
  - name: Server
    tags:
      - Server
      
# Every endpoint takes either a JWT or an API key unless it says otherwise.
# The exceptions declare their own: the four `/auth` endpoints and the three
# unauthenticated server endpoints use `security: []`, and everything under
# `/users/{user_id}` takes a JWT only, because an API key cannot manage the
# credentials it is one of.
security:
  - prosaToken: []
  - apiKey: []

servers:
  - url: http://{host}
    variables:
      host:
        default: localhost
        description: The server host
paths:
  /health:
    $ref: "paths/health.yaml"
  /config:
    $ref: "paths/config.yaml"
  /.well-known/jwks.json:
    $ref: "paths/.well-known/jwks.json.yaml"
  /books:
    $ref: "paths/books.yaml"
  /books/{book_id}/file-metadata:
    $ref: "paths/books/{book_id}/file-metadata.yaml"
  /books/{book_id}:
    $ref: "paths/books/{book_id}.yaml"
  /books/{book_id}/cover:
    $ref: "paths/books/{book_id}/cover.yaml"
  /books/{book_id}/metadata:
    $ref: "paths/books/{book_id}/metadata.yaml"
  /books/{book_id}/annotations:
    $ref: "paths/books/{book_id}/annotations.yaml"
  /books/{book_id}/annotations/{annotation_id}:
    $ref: "paths/books/{book_id}/annotations/{annotation_id}.yaml"
  /books/{book_id}/state:
    $ref: "paths/books/{book_id}/state.yaml"
  /shelves:
    $ref: "paths/shelves.yaml"
  /shelves/{shelf_id}:
    $ref: "paths/shelves/{shelf_id}.yaml"
  /shelves/{shelf_id}/books:
    $ref: "paths/shelves/{shelf_id}/books.yaml"
  /shelves/{shelf_id}/books/{book_id}:
    $ref: "paths/shelves/{shelf_id}/books/{book_id}.yaml"
  /auth/register:
    $ref: "paths/auth/register.yaml"
  /auth/login:
    $ref: "paths/auth/login.yaml"
  /auth/logout:
    $ref: "paths/auth/logout.yaml"
  /auth/refresh:
    $ref: "paths/auth/refresh.yaml"
  /users/{user_id}:
    $ref: "paths/users/{user_id}.yaml"
  /users/{user_id}/preferences:
    $ref: "paths/users/{user_id}/preferences.yaml"
  /users/{user_id}/keys:
    $ref: "paths/users/{user_id}/keys.yaml"
  /users/{user_id}/keys/{key_id}:
    $ref: "paths/users/{user_id}/keys/{key_id}.yaml"
  /sync:
    $ref: "paths/sync.yaml"
  /metadata-requests:
    $ref: "paths/metadata-requests.yaml"

components:
  securitySchemes:
    prosaToken:
      description: "User authentication JWT token."
      type: http
      scheme: bearer
      bearerFormat: JWT

    apiKey:
      description: "User API key."
      type: apiKey
      name: api-key
      in: header
