[package]
name = "prosa"
version = "0.2.0"
edition = "2024"
publish = false
include = ["src/**/*", "migrations/**/*"]
license = "MIT"

[dependencies]
argon2 = "0.6.0" 
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["multipart"] }
axum_typed_multipart = "0.16.7"
base64 = "0.23.1"
book-metadata = "0.1.0"
chacha20poly1305 = "0.11.0"
chrono = { version = "0.4.45", features = ["serde"] }
config = "0.15.25"
epub = "2.1.5"
image = "0.25.10"
jsonwebtoken = { version = "11.0.0", features = ["aws_lc_rs"] }
kepub-rs = "0.1.0"
log = "0.4.34"
merge = "0.2.0"
quick_cache = "0.7.0"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
rsa = "0.9.10"
serde = "1.0.229"
serde_json = "1.0.151"
serde_with = "3.23.0"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "chrono"] }
strum = "0.28.0"
strum_macros = "0.28.0"
tokio = { version = "1.53.1", features = ["full"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "chrono"] }
uuid = { version = "1.26.0", features = ["v4"] }
